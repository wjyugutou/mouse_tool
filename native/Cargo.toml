[package]
name = "yugutou-native"
version = "4.3.0"
edition = "2021"
publish = false
description = "yugutou_tool 的 Rust 核心：设备插件、电量采样、设置、托盘图标、开机自启（NSH mixed）"

# 单独构建，不并入仓库里其它 Cargo 工作区。
[workspace]

[dependencies]
nsh-core = "0.6.1"
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
