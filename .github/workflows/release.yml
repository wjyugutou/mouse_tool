name: Release

# pnpm release:bump <version> 推送 tag v<version> 后触发：
# 检查 → 测试 → 打包 → Inno Setup 安装包 → 签名的 latest.json → GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OUT_DIR: .nsh/release

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node（只跑 scripts/*.mjs，不装依赖）
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native -> ../target

      # 版本只写在 package.json 的 nshVersion；scripts/nsh.mjs 把它装到 .tools/nsh。
      - name: Install nsh CLI
        run: node scripts/nsh.mjs --version

      - name: Check version matches tag
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          node scripts/sync-version.mjs --check "$VER"

      - name: nsh check
        run: node scripts/nsh.mjs check

      - name: nsh test
        run: node scripts/nsh.mjs test

      - name: nsh build --release
        run: node scripts/nsh.mjs build --release

      # windows-latest 镜像预装了 Inno Setup 6（runner 清单里写着 `InnoSetup 6.7.1`），
      # 所以这里通常 0 秒通过、`choco install` 不执行；只有镜像哪天不再带它时才会走安装分支。
      # nsh 在 PATH、ProgramFiles(x86)、ProgramFiles、LOCALAPPDATA 下找 ISCC.exe，
      # 把 ISCC 所在目录写进 GITHUB_PATH 是为了让它能命中。
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          Split-Path $iscc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: nsh package
        run: node scripts/nsh.mjs package --target windows --icon assets/icon.png -o ${{ env.OUT_DIR }}

      # nsh 不写安装包语言，找到 ISCC 时会先编出英文安装包。
      # installer-zh 给 .iss 加上简体中文并覆盖编译，然后再加上版本号改名。
      - name: Build installer (Inno Setup, 简体中文)
        shell: pwsh
        run: |
          node scripts/installer-zh.mjs $env:OUT_DIR --require
          if ($LASTEXITCODE -ne 0) { throw "installer-zh failed" }
          $out = $env:OUT_DIR
          $setup = Join-Path $out 'yugutou_tool-setup.exe'
          if (-not (Test-Path $setup)) { throw "installer not built: $setup" }
          Move-Item $setup (Join-Path $out "yugutou_tool-$env:VER-setup.exe") -Force
          Get-ChildItem $out | Format-Table Name, Length

      - name: Release notes
        shell: bash
        run: |
          FILE="docs/releases/v${VER}.md"
          if [[ ! -f "$FILE" ]]; then
            node scripts/gen-release-notes.mjs --to "$GITHUB_REF_NAME" --tag "$GITHUB_REF_NAME" --write "$FILE"
          fi
          cp "$FILE" "$OUT_DIR/notes.md"

      - name: Update manifest (latest.json + latest.json.sig)
        shell: pwsh
        env:
          NSH_UPDATE_KEY: ${{ secrets.NSH_UPDATE_KEY }}
        run: |
          if (-not $env:NSH_UPDATE_KEY) { throw 'secret NSH_UPDATE_KEY is not set' }
          $key = Join-Path $env:RUNNER_TEMP 'update.secret'
          [IO.File]::WriteAllText($key, $env:NSH_UPDATE_KEY.Trim() + "`n")
          try {
            $archive = Get-ChildItem $env:OUT_DIR -Filter "*-$env:VER-windows-x86_64.zip" | Select-Object -First 1
            if (-not $archive) { throw "update archive for $env:VER not found" }
            node scripts/nsh.mjs update-manifest $archive.FullName --notes (Join-Path $env:OUT_DIR 'notes.md') --key $key -o $env:OUT_DIR
            if ($LASTEXITCODE -ne 0) { throw 'nsh update-manifest failed' }
          } finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
          Get-Content (Join-Path $env:OUT_DIR 'latest.json')

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$OUT_DIR"
          ASSETS=(yugutou_tool-"$VER"-setup.exe *-"$VER"-windows-x86_64.zip latest.json latest.json.sig)
          shopt -s nullglob
          for f in notes.*.md; do ASSETS+=("$f"); done
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --title "yugutou_tool v$VER" --notes-file notes.md --latest
          fi
